<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monbas Passive Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body data-page="party">
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Monbas Passive Calculator</p>
          <h1>パッシブ比較・パーティー作成アプリ</h1>
        </div>
        <div class="topbar-actions">
          <a href="monster-manager.html" class="secondary-btn inline-link">モンスター管理</a>
          <button id="pdf-export-btn" class="primary-btn">PDF出力</button>
        </div>
      </header>

      <main>
        <section id="party-builder-section" class="panel active-panel">
          <div class="section-header">
            <h2>パーティー一覧</h2>
            <button id="add-party-btn" class="secondary-btn">パーティー追加</button>
          </div>

          <div class="summary-card">
            <div>
              <span class="summary-label">総合合計</span>
              <strong id="overall-total">0</strong>
            </div>
          </div>

          <div id="parties-container" class="parties-container"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
