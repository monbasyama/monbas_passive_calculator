<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ちょいと召喚モンスターバスケット</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="party">
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">ちょいと召喚モンスターバスケット</p>
          <h1>パッシブ比較・パーティー作成アプリ</h1>
        </div>
        <div class="topbar-actions">
          <a href="how-to-use.html" class="secondary-btn inline-link"><i class="fas fa-question-circle" aria-hidden="true"></i>使い方</a>
          <button id="party-compare-btn" class="secondary-btn"><i class="fas fa-scale-balanced" aria-hidden="true"></i>パーティー比較</button>
          <button id="pdf-export-btn" class="primary-btn" style="flex-basis:100%"><i class="fas fa-file-pdf" aria-hidden="true"></i>PDF出力</button>
          <a href="monster-search.html" class="secondary-btn inline-link" style="flex-basis:100%"><i class="fas fa-search" aria-hidden="true"></i>モンスター検索</a>
          <button id="ai-search-btn" type="button" class="secondary-btn" style="flex-basis:100%" aria-expanded="false" aria-controls="ai-search-panel"><i class="fas fa-robot" aria-hidden="true"></i>AI検索</button>
          <form id="ai-search-panel" class="ai-search-panel" hidden style="flex-basis:100%">
            <div id="ai-chat-log" class="ai-chat-log" aria-live="polite"></div>
            <div class="ai-chat-input-row">
              <input id="ai-chat-input" type="text" maxlength="200" placeholder="例: 素早さのパッシブが高いパーティを作成して" autocomplete="off" />
              <button type="button" id="ai-chat-clear" class="secondary-btn" aria-label="チャット結果をクリア"><i class="fas fa-eraser" aria-hidden="true"></i>クリア</button>
              <button type="submit" class="primary-btn">送信</button>
            </div>
          </form>
          <button id="party-refresh-data" type="button" class="secondary-btn" style="flex-basis:100%"><i class="fas fa-sync-alt" aria-hidden="true"></i>最新データ取得</button>
        </div>
        <span class="app-version" id="app-version">ver 1.0</span>
      </header>

      <aside class="utility-sidebar" aria-label="管理者メニュー">
        <a href="monster-manager.html" id="monster-manager-link">管理者メニュー</a>
      </aside>

      <main>
        <section id="party-builder-section" class="panel active-panel">
          <div class="section-header">
            <h2>パーティー一覧</h2>
            <button id="add-party-btn" class="secondary-btn"><i class="fas fa-circle-plus" aria-hidden="true"></i>パーティー追加</button>
            <button id="clear-parties-btn" class="danger-btn" type="button"><i class="fas fa-trash" aria-hidden="true"></i>クリア</button>
          </div>

          <div id="parties-container" class="parties-container"></div>
        </section>
      </main>
    </div>

    <script src="monster.js"></script>
    <script src="app.js"></script>
  </body>
</html>
